#################
### AUTOSTART ###
#################

# Make Sway's Wayland/session environment available to D-Bus-activated apps.
exec dbus-update-activation-environment WAYLAND_DISPLAY DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP XDG_SESSION_TYPE

# PipeWire is a user-session service; start it from Sway instead of a systemd user unit.
exec pipewire

# Desktop services
exec mako
exec autotiling

# Battery notification
exec ~/.config/sway/scripts/battery-notify

# Authentication / clipboard
exec /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec wl-paste --type text --watch cliphist store
exec wl-paste --type image --watch cliphist store
