"$schema" = 'https://starship.rs/config-schema.json'

format = """
[  ](bg:#B8B8B8 fg:#181818)\
[▌](bg:#202020 fg:#B8B8B8)\
$directory\
[▌](fg:#202020 bg:#2E2E2E)\
$git_branch\
$git_status\
[▌](fg:#2E2E2E)\
\n$character"""

[directory]
style = "fg:#E8E8E8 bg:#202020"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
style = "bg:#2E2E2E"
format = '[[ $symbol $branch ](fg:#E8E8E8 bg:#2E2E2E)]($style)'

[git_status]
style = "bg:#2E2E2E"
format = '[[($all_status$ahead_behind )](fg:#B8B8B8 bg:#2E2E2E)]($style)'
