<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

    <!-- Default UI font -->
    <alias>
        <family>sans-serif</family>
        <prefer>
            <family>0xProto Nerd Font</family>
        </prefer>
    </alias>

    <!-- Default terminal/code font -->
    <alias>
        <family>monospace</family>
        <prefer>
            <family>0xProto Nerd Font Mono</family>
        </prefer>
    </alias>

</fontconfig>
