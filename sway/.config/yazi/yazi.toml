[mgr]
show_hidden = false
sort_by = "natural"
sort_sensitive = false
sort_dir_first = true
ratio = [0, 7, 3]
linemode = "size"

[preview]
max_width = 400
max_height = 650
image_filter = "triangle"
image_quality = 75

[[plugin.prepend_previewers]]
mime = "application/{*zip,tar,bzip2,7z*,rar,xz,zstd,java-archive}"
run = "ouch --show-file-icons"

[opener]

play = [
    { run = "mpv %s", orphan = true }
]

edit = [
    { run = "nvim %s", block = true }
]

book = [
    { run = "zathura %s", orphan = true }
]

image = [
    { run = "imv-dir %s", orphan = true }
]

extract = [
    { run = "ouch d -y %s", desc = "Extract here", for = "unix" }
]

[open]
prepend_rules = [
    { mime = "application/pdf", use = "book" },
    { mime = "application/epub+zip", use = "book" },

    { mime = "image/*", use = "image" },
    { mime = "{video,audio}/*", use = "play" },
]
