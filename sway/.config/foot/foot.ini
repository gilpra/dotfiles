[main]
shell=/usr/bin/zsh
font=0xProto Nerd Font Mono:size=11
font-italic=0xProto Nerd Font Mono:size=11:slant=italic
pad=1x4
resize-by-cells=no

[url]
launch=xdg-open ${url}

[cursor]
style=beam
blink=yes

[colors-dark]
alpha=1.0

# Foreground / Background
foreground=e8e8e8
background=181818

# Selection
selection-foreground=e8e8e8
selection-background=303030

# URL
urls=a0dcd2

# Bell flash
flash=303030

# Normal colors
regular0=181818
regular1=f0a0a0
regular2=bde59f
regular3=ebd38f
regular4=b9d1f2
regular5=d5b5e8
regular6=a9e0d8
regular7=e8e8e8

# Bright colors
bright0=7a7a7a
bright1=f6b6b6
bright2=cfeab5
bright3=f3e1a8
bright4=d0e0f6
bright5=e4caf0
bright6=c0e9e3
bright7=ffffff

# Extended 256-color palette overrides
16=e8e8e8
17=7a7a7a
