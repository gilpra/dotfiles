[main]
shell=/bin/fish
font=0xProto Nerd Font Mono:size=11
font-italic=0xProto Nerd Font Mono:size=11:slant=italic
pad=1x4

[url]
launch=xdg-open ${url}

[cursor]
style=beam
blink=yes

[colors-dark]
alpha=1.0

# Foreground / Background
foreground=e8e8e8
background=181818

# Selection
selection-foreground=e8e8e8
selection-background=343434

# URL
urls=ffffff

# Bell flash
flash=5a5a5a

# Normal colors
regular0=181818
regular1=6f6f6f
regular2=9a9a9a
regular3=b8b8b8
regular4=d0d0d0
regular5=e0e0e0
regular6=f0f0f0
regular7=e8e8e8

# Bright colors
bright0=2a2a2a
bright1=7a7a7a
bright2=aaaaaa
bright3=c8c8c8
bright4=dddddd
bright5=ededed
bright6=f7f7f7
bright7=ffffff

# Extended ANSI
16=ffffff
17=5a5a5a
